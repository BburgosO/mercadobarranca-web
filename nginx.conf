server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El proxy del host ya entrega la IP real del visitante
    real_ip_header X-Forwarded-For;

    charset utf-8;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---- Fichas de producto: /producto/salmon-en-porciones ----
    location ~ ^/producto/([a-z0-9-]+)/?$ {
        try_files /producto.html =404;
    }

    # ---- Páginas internas ----
    location = /despachos { try_files /despachos.html =404; }
    location = /empresas  { try_files /empresas.html =404; }

    # ---- Panel de administración ----
    # El acceso lo controla Supabase Auth: pide correo y contraseña, y además
    # verifica que la cuenta esté en la tabla admins. Sin eso no deja entrar
    # ni permite escribir nada en la base.
    location /admin {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- HTML: caché corta, para que los cambios se vean al tiro ----
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
    }

    # ---- CSS y JS: una hora como máximo ----
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # ---- Imágenes y fuentes: pueden quedarse mucho tiempo ----
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    # La portada tampoco debe quedar pegada en el navegador
    location = / {
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /index.html;
}
