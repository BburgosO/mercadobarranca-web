# /etc/nginx/sites-available/mercadobarranca.cl
#
# Instalación:
#   ln -s /etc/nginx/sites-available/mercadobarranca.cl /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d mercadobarranca.cl -d www.mercadobarranca.cl
#
# El contenedor escucha en 127.0.0.1:8041 y no está expuesto a internet:
# todo el tráfico entra por este nginx.

server {
    listen 80;
    listen [::]:80;
    server_name mercadobarranca.cl www.mercadobarranca.cl;

    # certbot reemplaza este bloque por la redirección a HTTPS
    location / {
        proxy_pass http://127.0.0.1:8041;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ---------------------------------------------------------------
    # OPCIONAL · segunda contraseña para /admin, antes de la de Supabase.
    # El panel ya pide correo y clave (Supabase Auth) y verifica que la
    # cuenta esté en la tabla admins. Esto agrega una capa previa, por si
    # prefieres que la ruta no se pueda ni abrir sin credencial.
    #
    # Para activarlo:
    #   apt install apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd-barranca TU_USUARIO
    # y descomenta:
    #
    # location /admin {
    #     auth_basic "Panel Mercado Barranca";
    #     auth_basic_user_file /etc/nginx/.htpasswd-barranca;
    #
    #     proxy_pass http://127.0.0.1:8041;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # ---------------------------------------------------------------

    access_log /var/log/nginx/mercadobarranca.access.log;
    error_log  /var/log/nginx/mercadobarranca.error.log;

    client_max_body_size 10M;
}
